<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">SBQ Center Logo</title>
  <desc id="desc">A gold and navy logo with a magnifying glass and globe, representing SBQ Center.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#f7e7a9"/>
      <stop offset="18%" stop-color="#f0d17a"/>
      <stop offset="50%" stop-color="#c58f1d"/>
      <stop offset="82%" stop-color="#f2d679"/>
      <stop offset="100%" stop-color="#8c5a12"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" x2="1">
      <stop offset="0%" stop-color="#0d2f58"/>
      <stop offset="100%" stop-color="#061b39"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#0b0b0d"/>

  <g filter="url(#shadow)">
    <circle cx="600" cy="240" r="165" fill="none" stroke="url(#gold)" stroke-width="18"/>
    <circle cx="600" cy="240" r="136" fill="url(#navy)"/>
    <circle cx="600" cy="240" r="104" fill="none" stroke="url(#gold)" stroke-width="9"/>
    <circle cx="600" cy="240" r="34" fill="#f2d784"/>
    <path d="M600 130 V350 M480 240 H720 M520 170 Q600 210 680 170 M520 310 Q600 270 680 310" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <path d="M420 680 C510 620, 700 620, 780 680 L780 810 L420 810 Z" fill="url(#gold)" opacity="0.9"/>
    <path d="M420 680 C470 650, 540 630, 600 650 C660 630, 730 650, 780 680" fill="none" stroke="#fff1be" stroke-width="10" stroke-linecap="round" opacity="0.7"/>

    <g transform="translate(300,330)">
      <path d="M0 120 L110 40 L250 40 L250 180 L110 180 Z" fill="url(#gold)" opacity="0.9"/>
      <path d="M0 120 L110 180 L250 180 L250 40 L110 40 Z" fill="url(#navy)" opacity="0.95"/>
      <path d="M250 120 L360 40 L500 40 L500 180 L360 180 Z" fill="url(#gold)" opacity="0.9"/>
      <path d="M250 120 L360 180 L500 180 L500 40 L360 40 Z" fill="url(#navy)" opacity="0.95"/>
      <path d="M500 120 L610 40 L750 40 L750 180 L610 180 Z" fill="url(#gold)" opacity="0.9"/>
      <path d="M500 120 L610 180 L750 180 L750 40 L610 40 Z" fill="url(#navy)" opacity="0.95"/>
    </g>

    <g transform="translate(425, 310)">
      <circle cx="175" cy="120" r="88" fill="#d9a82f" stroke="#f7e1a0" stroke-width="8"/>
      <path d="M90 120 C90 60, 140 20, 175 20 C210 20, 260 60, 260 120 C260 180, 210 220, 175 220 C140 220, 90 180, 90 120 Z" fill="none" stroke="#0d2b49" stroke-width="3" opacity="0.65"/>
      <path d="M175 30 L175 210 M95 120 H255 M120 70 C150 90, 160 100, 175 120 C190 100, 200 90, 230 70 M120 170 C150 150, 160 140, 175 120 C190 140, 200 150, 230 170" fill="none" stroke="#0d2b49" stroke-width="3" opacity="0.65"/>
    </g>

    <text x="600" y="520" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="180" letter-spacing="-10" fill="url(#gold)">SBQ</text>
    <path d="M240 570 H960" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <path d="M300 610 H900" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <text x="600" y="700" text-anchor="middle" direction="rtl" font-family="Tahoma, Arial, sans-serif" font-size="42" font-weight="700" fill="url(#gold)" letter-spacing="1">مركز سبق للدراسات والخدمات الاستشارية</text>
    <text x="600" y="750" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="7" fill="#f0d784">SBQ CENTER FOR RESEARCH AND CONSULTING SERVICES</text>
    <text x="600" y="795" text-anchor="middle" direction="rtl" font-family="Tahoma, Arial, sans-serif" font-size="28" font-weight="700" fill="url(#gold)">من عمق المعرفة إلى صواب القرار</text>
  </g>
</svg>
